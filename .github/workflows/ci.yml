name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Tests & Governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Run Backend Tests (226 passed)
        run: |
          cd backend && pytest

      - name: Run Governance Scripts Unit Tests (157 passed)
        run: |
          python -m pytest scripts/tests -q

      - name: Run Governance Workflow Check (Offline Hard Gate)
        run: |
          python3 scripts/jev_workflow_check.py --offline

      - name: Run Governance Workflow Check (Online Jev Model)
        if: env.TYPESAFE_API_KEY != ''
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          python3 scripts/jev_workflow_check.py

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run Vitest Unit Tests (180 passed)
        run: |
          cd frontend && npm test

      - name: Run TypeScript & Vite Build
        run: |
          cd frontend && npm run build

  e2e:
    name: Playwright E2E Geometry & Interaction
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Install Playwright Chromium with OS Dependencies
        run: |
          npx playwright install --with-deps chromium

      - name: Launch Test Backend on Port 8788
        run: |
          PYTHONPATH=backend QTV_PORT=8788 python -m app.main > /tmp/backend-test.log 2>&1 &
          echo "Waiting for backend on port 8788..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8788/api/session; then
              echo "Backend ready!"
              break
            fi
            sleep 1
          done

      - name: Run Playwright E2E Geometric & Interaction Verification (37 passed)
        run: |
          QTV_PORT=8788 node frontend/scripts/e2e.mjs
